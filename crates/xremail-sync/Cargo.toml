[package]
name = "xremail-sync"
description = "Xremail synchronisation: IMAP-aware orchestration, scheduling and operation recovery."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
xremail-core = { workspace = true }
xremail-store = { workspace = true }
xremail-protocol-imap = { workspace = true }
# 解析拉回来的邮件（charset / MIME）。
xremail-message = { path = "../xremail-message" }
sqlx = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# 端到端测试用假 IMAP 服务器（见 tests/pull_sync.rs）。
xremail-testkit = { path = "../xremail-testkit" }
# 「崩溃后重启」用例需要一个**文件**库（内存库随进程一起没了）。
tempfile = "3"
