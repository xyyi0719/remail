[package]
name = "xremail-message"
description = "Xremail message parsing: MIME structure, charset decoding and RFC 5322 headers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
xremail-core = { workspace = true }
# 字符集解码：覆盖 UTF-8 / GBK / GB18030 / Big5 / ISO-8859-* 等。
# encoding_rs 是 WHATWG Encoding Standard 的 Rust 实现。
encoding_rs = "0.8"
# MIME 的 base64 传输编码。
base64 = "0.22"
thiserror = { workspace = true }
