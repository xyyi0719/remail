[package]
name = "xremail-shell"
description = "Xremail application shell (Tauri): desktop + mobile front end host."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# The `_lib` suffix keeps the lib name unique and avoids clashing with the
# binary name on Windows (cargo#8519).
name = "xremail_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
# 选附件用的系统文件对话框。
# 选的是**路径**，字节由后端自己读——
# 免得几十 MB 的文件在前端读成字节数组再进 IPC（参数体会被撑爆）。
tauri-plugin-dialog = "2"

xremail-core = { workspace = true }
xremail-store = { workspace = true }
xremail-api = { workspace = true }
# 同步引擎与 IMAP 协议层。
xremail-sync = { workspace = true }
xremail-protocol-imap = { workspace = true }
# SMTP 协议层（真发信）与 MIME 构建（发信用的字节）。
xremail-protocol-smtp = { workspace = true }
xremail-message = { workspace = true }
sqlx = { workspace = true }
# 异步运行时：服务层要 `tokio::time::sleep`（补「已发送」副本前等一拍）。
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# 实现 xremail_api::SecretStore 需要 async_trait 宏（契约用它定义）。
async-trait = "0.1"

[target.'cfg(windows)'.dependencies]
# Windows 凭据管理器适配（见 src/secrets/）。
# 只在 Windows 上生效，其它平台用 src/secrets/unsupported.rs 的桩。
windows = { workspace = true }

[dev-dependencies]
# 临时目录用于测试库文件。
tempfile = "3"
tokio = { workspace = true }
# 假 SMTP 服务器：发信链路必须在 CI 里能跑，不能依赖真实邮箱。
xremail-testkit = { workspace = true }
xremail-protocol-smtp = { workspace = true }
# tauri 的 test 特性：提供 mock_builder / get_ipc_response，
# 用来测 Command 层的 IPC 序列化（见 tests/command_ipc.rs）。
tauri = { version = "2", features = ["test"] }
