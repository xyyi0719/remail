name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # sqlx 的 query! 宏默认连库校验 schema。CI 里改为只读仓库中的
  # 离线查询数据（.sqlx/），无需起数据库；数据是否过期由单独的
  # “Verify sqlx offline data” 步骤检查。
  SQLX_OFFLINE: "true"

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf
          sudo apt-get install -y libayatana-appindicator3-dev \
            || sudo apt-get install -y libappindicator3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/* -> target

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        # --no-fail-fast：不让一个失败的测试二进制**掩盖后面**的失败。
        # 默认行为是第一个失败就停，ubuntu 上曾经因此只看到 8 个失败，
        # 而实际后面还可能有别的（2026-10-26）。
        run: cargo test --workspace --no-fail-fast

      - name: Verify sqlx offline data
        # .sqlx/ 必须与迁移和查询保持同步：迁移改了 schema 而忘了重新
        # prepare，编译期校验就会用旧数据放过不一致的查询。
        # --check 模式在数据过期时返回 1。
        #
        # 只在 ubuntu 上跑一次：该检查与平台无关，而 sqlx-cli 从源码
        # 编译需要几分钟，重复跑两遍只是浪费时间。
        if: matrix.os == 'ubuntu-latest'
        env:
          # 这一步必须**真的连库**比对，因此要关掉离线模式；
          # 否则拿旧缓存跟自己比，检查形同虚设。
          SQLX_OFFLINE: "false"
          DATABASE_URL: sqlite://target/xremail-ci.db
        run: |
          cargo install sqlx-cli --version 0.9.0 --no-default-features --features sqlite,rustls --locked
          # SQLite 下 sqlx 不会自动创建库文件（会报 unable to open database file），
          # 需先建空文件再套用迁移。
          touch target/xremail-ci.db
          sqlx migrate run --source crates/xremail-store/migrations
          cargo sqlx prepare --workspace --check -- --all-targets

      - name: Report test case count
        # windows-latest 默认 shell 是 PowerShell，不支持 $(...)/grep/2>/dev/null。
        shell: bash
        run: |
          count=$(cargo test --workspace -- --list 2>/dev/null | grep -c ': test$' || true)
          echo "Rust test cases: $count"
          echo "### Rust test cases: $count" >> "$GITHUB_STEP_SUMMARY"

  web:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/shell/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix apps/shell

      - name: Type check
        run: npm run typecheck --prefix apps/shell

      - name: Build
        run: npm run build --prefix apps/shell

  docs:
    name: Docs sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check internal doc links
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          # 覆盖 docs/ 与根目录的 README/CHANGELOG，避免根目录链接无人校验。
          targets = sorted(pathlib.Path('docs').rglob('*.md'))
          targets += [p for p in (pathlib.Path('README.md'), pathlib.Path('CHANGELOG.md')) if p.exists()]
          bad = []
          for md in targets:
              text = md.read_text(encoding='utf-8')
              # 去掉代码块，避免示例中的路径被误判为链接。
              text = re.sub(r'```.*?```', '', text, flags=re.S)
              for m in re.finditer(r'\[[^\]]*\]\(([^)#]+?)(?:#[^)]*)?\)', text):
                  target = m.group(1)
                  if target.startswith(('http://', 'https://', 'mailto:')):
                      continue
                  resolved = (md.parent / target).resolve()
                  if not resolved.exists():
                      bad.append(f"{md}: {target}")
          if bad:
              print("Broken internal links:")
              print("\n".join(bad))
              sys.exit(1)
          print(f"All internal doc links OK ({len(targets)} files)")
          PY

      - name: Check Rust doc-comment links
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          # 校验源码注释里指向 docs/ 的相对路径（曾经全部断链）。
          bad = []
          for rs in pathlib.Path('.').rglob('*.rs'):
              if 'target' in rs.parts or 'node_modules' in rs.parts:
                  continue
              text = rs.read_text(encoding='utf-8')
              for m in re.finditer(r'\((\.\.?/[^)\s]+)\)', text):
                  resolved = (rs.parent / m.group(1)).resolve()
                  if not resolved.exists():
                      bad.append(f"{rs}: {m.group(1)}")
          if bad:
              print("Broken doc-comment links:")
              print("\n".join(bad))
              sys.exit(1)
          print("All Rust doc-comment links OK")
          PY
